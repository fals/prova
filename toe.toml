# toe's own suites. From M1 on, tests run through toe (AGENTS.md, Stage B):
#   .toe/stable/bin/toe run small
# small and medium run under cargo-nextest with its libtest JSON stream, so
# toe sees toe's own tests at full fidelity (native level, per-test
# durations). The format version is pinned; the stream is experimental.
[suite.small]
run = "NEXTEST_EXPERIMENTAL_LIBTEST_JSON=1 cargo nextest run --lib --bins --no-fail-fast --message-format libtest-json --message-format-version 0.1"
select = "NEXTEST_EXPERIMENTAL_LIBTEST_JSON=1 cargo nextest run --lib --bins --no-fail-fast --message-format libtest-json --message-format-version 0.1 {filter}"
size = "small"

[suite.medium]
run = "NEXTEST_EXPERIMENTAL_LIBTEST_JSON=1 cargo nextest run --tests --no-fail-fast --message-format libtest-json --message-format-version 0.1"
select = "NEXTEST_EXPERIMENTAL_LIBTEST_JSON=1 cargo nextest run --tests --no-fail-fast --message-format libtest-json --message-format-version 0.1 {filter}"
size = "medium"
stall_after = "2m"

[suite.spec]
run = "scripts/ci.sh"
size = "large"
stall_after = "5m"

# Real fixture projects in every claimed language: go and cargo on the host,
# Python, TypeScript, Java and C# in official images (needs docker). Opt-in.
[suite.large]
run = "cargo test -p toe-cli --test fixtures_large -- --ignored"
size = "large"
stall_after = "3m"
