# toe's own suites. From M1 on, tests run through toe (AGENTS.md, Stage B):
#   .toe/stable/bin/toe run small
[suite.small]
run = "cargo test --lib --bins"
select = "cargo test --lib --bins -- {filter}"
size = "small"

[suite.medium]
run = "cargo test --tests --no-fail-fast"
select = "cargo test --tests -- {filter}"
size = "medium"
stall_after = "2m"

[suite.spec]
run = "scripts/ci.sh"
size = "large"
stall_after = "5m"

# Real fixture projects in every claimed language: go and cargo on the host,
# Python, TypeScript, Java and C# in official images (needs docker). Opt-in.
[suite.large]
run = "cargo test -p toe-cli --test fixtures_large -- --ignored"
size = "large"
stall_after = "3m"

# toe serve in a kind cluster, a fixture Job, a client outside (docker, kind).
[suite.cluster]
run = "scripts/kind-e2e.sh"
size = "large"
stall_after = "5m"
