name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --no-fail-fast

  spec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm install -g @informalsystems/quint@0.33.1
      - name: Typecheck and unit-test specs
        working-directory: spec
        run: |
          for f in *.qnt; do quint typecheck "$f"; quint test "$f"; done
      - name: Model check (random simulation)
        working-directory: spec
        run: |
          for s in run experiment; do
            quint run "$s.qnt" --invariant safety --max-steps 25 --max-samples 20000
          done
      - name: Fresh traces replayed against the engine
        run: |
          scripts/spec-traces.sh "$RUNNER_TEMP/run" 60 "" run
          scripts/spec-traces.sh "$RUNNER_TEMP/exp" 60 "" experiment
          PROVA_TRACE_DIR="$RUNNER_TEMP/run" cargo test -p prova-core --test spec_replay
          PROVA_TRACE_DIR_EXP="$RUNNER_TEMP/exp" cargo test -p prova-core --test spec_replay_experiment

  # The release path, on every change: a static Linux binary, its package,
  # the release image and the install script (tags publish them).
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p prova-cli --target x86_64-unknown-linux-musl
      - name: Package as the release does
        run: |
          name=prova-x86_64-unknown-linux-musl
          mkdir -p dist "$name" image/amd64
          cp target/x86_64-unknown-linux-musl/release/prova README.md LICENSE "$name"/
          tar czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          cp "$name/prova" image/amd64/
      - name: Install script against the package
        run: |
          PROVA_BASE_URL="file://$PWD/dist" PROVA_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/prova" --version
      - name: Release image
        run: |
          docker build -f Dockerfile.release --build-arg TARGETARCH=amd64 -t prova:release image
          docker run --rm prova:release --version
