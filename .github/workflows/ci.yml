name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # Every platform a release ships for runs the whole suite.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # A step limit, unlike cancelling, keeps the log: a hung test is then
      # named by libtest's "has been running for over 60 seconds".
      - run: cargo test --no-fail-fast
        timeout-minutes: 8

  spec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm install -g @informalsystems/quint@0.33.1
      # quint downloads its Rust evaluator through GitHub's API without a
      # token, so runners share the anonymous rate limit and the spec job
      # failed on "rate limit exceeded". Fetch it with the workflow's token
      # into the directory quint looks in first; quint then never downloads.
      - name: Install the Quint evaluator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -o "QUINT_EVALUATOR_VERSION = '[^']*'" "$(npm root -g)/@informalsystems/quint/dist/src/rust/binaryManager.js" | cut -d"'" -f2)
          dir="$HOME/.quint/rust-evaluator-$v"
          mkdir -p "$dir"
          gh release download "evaluator/$v" -R quint-co/quint -p 'quint_evaluator-x86_64-unknown-linux-gnu.tar.gz' -O - | tar xz -C "$dir"
          test -x "$dir/quint_evaluator"
      - name: Typecheck and unit-test specs
        working-directory: spec
        run: |
          for f in *.qnt; do quint typecheck "$f"; quint test "$f"; done
      - name: Model check (random simulation)
        working-directory: spec
        run: |
          for s in run experiment; do
            quint run "$s.qnt" --invariant safety --max-steps 25 --max-samples 20000
          done
      - name: Fresh traces replayed against the engine
        run: |
          scripts/spec-traces.sh "$RUNNER_TEMP/run" 60 "" run
          scripts/spec-traces.sh "$RUNNER_TEMP/exp" 60 "" experiment
          PROVA_TRACE_DIR="$RUNNER_TEMP/run" cargo test -p prova-core --test spec_replay
          PROVA_TRACE_DIR_EXP="$RUNNER_TEMP/exp" cargo test -p prova-core --test spec_replay_experiment

  # The release path, on every change: a static Linux binary, its package,
  # the release image and the install script (tags publish them).
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p prova-cli --target x86_64-unknown-linux-musl
      - name: Package as the release does
        run: |
          name=prova-x86_64-unknown-linux-musl
          mkdir -p dist "$name" image/amd64
          cp target/x86_64-unknown-linux-musl/release/prova README.md LICENSE "$name"/
          tar czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          cp "$name/prova" image/amd64/
      - name: Install script against the package
        run: |
          PROVA_BASE_URL="file://$PWD/dist" PROVA_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/prova" --version
      - name: Smoke test of the installed binary
        run: scripts/smoke.sh "$RUNNER_TEMP/bin/prova"
      - name: Release image
        run: |
          docker build -f Dockerfile.release --build-arg TARGETARCH=amd64 -t prova:release image
          docker run --rm prova:release --version
