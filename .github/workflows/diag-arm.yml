# TEMPORARY (issue #75): find why the short-commands test froze the arm64
# runner. Deleted before #74 merges.
name: diag-arm
on:
  pull_request:
    paths: [.github/workflows/diag-arm.yml]
jobs:
  diag:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b20bd96a1256159c534c8576363ec3684ab9ce6c
      - uses: dtolnay/rust-toolchain@stable
      - name: Limits
        run: |
          nproc; cat /proc/sys/kernel/pid_max; ulimit -u
          cg=/sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup); echo "cgroup $cg"
          cat $cg/pids.max $cg/pids.current 2>&1
          systemctl show 'actions.runner*' -p TasksMax -p TasksCurrent 2>&1 | head
      - run: cargo test -q -p prova-cli --test opaque_run --no-run
      - name: The test, in its own session, every kill() recorded
        shell: bash {0}
        run: |
          set -x
          command -v strace || sudo apt-get install -y -q strace >/dev/null
          echo "step shell: pid $$ pgid $(ps -o pgid= -p $$) sid $(ps -o sid= -p $$)"
          timeout 120 setsid --wait strace -f -qq -e trace=kill,tgkill,tkill -e signal=none -o kills.txt \
            cargo test -q -p prova-cli --test opaque_run -- a_loop_of_short_commands_is_not_a_stall --test-threads 1 --nocapture > out.txt 2>&1
          echo "rc=$?"
          tail -30 out.txt
          echo "== kill() calls:"; grep -v "kill(0, 0)\|, 0)" kills.txt | head -60
          exit 0
