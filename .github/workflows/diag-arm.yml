# TEMPORARY (issue #75): find why the short-commands test froze the arm64
# runner. Deleted before #74 merges.
name: diag-arm
on:
  pull_request:
    paths: [.github/workflows/diag-arm.yml]
jobs:
  diag:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b20bd96a1256159c534c8576363ec3684ab9ce6c
      - uses: dtolnay/rust-toolchain@stable
      - name: Limits
        run: |
          nproc; cat /proc/sys/kernel/pid_max; ulimit -u
          cg=/sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup); echo "cgroup $cg"
          cat $cg/pids.max $cg/pids.current 2>&1
          systemctl show 'actions.runner*' -p TasksMax -p TasksCurrent 2>&1 | head
      - run: cargo build -q -p prova-cli --tests
      - name: The test, watched
        shell: bash {0}
        run: |
          set -x
          cg=/sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup)
          ( for i in $(seq 1 60); do echo "t=$i pids=$(cat $cg/pids.current 2>/dev/null) procs=$(ps -e --no-headers | wc -l)"; sleep 1; done ) &
          ls target/debug/deps/ | grep -E '^opaque_run-[0-9a-f]+$'
          b=$(ls target/debug/deps/ | grep -E '^opaque_run-[0-9a-f]+$' | head -1)
          echo "pgid of this shell: $(ps -o pgid= -p $$) sid: $(ps -o sid= -p $$)"
          timeout 90 target/debug/deps/$b a_loop_of_short_commands_is_not_a_stall --test-threads 1 --nocapture > out.txt 2>&1
          echo "test rc=$?"
          cat out.txt
          ps -eo pid,pgid,sid,stat,etime,args | tail -25
          exit 0
