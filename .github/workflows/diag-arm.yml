# TEMPORARY (issue #75): find why the short-commands test froze the arm64
# runner. Deleted before #74 merges.
name: diag-arm
on:
  pull_request:
    paths: [.github/workflows/diag-arm.yml]
jobs:
  diag:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b20bd96a1256159c534c8576363ec3684ab9ce6c
      - uses: dtolnay/rust-toolchain@stable
      - name: Limits
        run: |
          nproc; cat /proc/sys/kernel/pid_max; ulimit -u
          cg=/sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup); echo "cgroup $cg"
          cat $cg/pids.max $cg/pids.current 2>&1
          systemctl show 'actions.runner*' -p TasksMax -p TasksCurrent 2>&1 | head
      - run: cargo test -q --no-run
      - name: The whole suite, kills at older pids echoed live
        shell: bash {0}
        run: |
          me=$$
          echo "step shell: pid $me pgid $(ps -o pgid= -p $me) sid $(ps -o sid= -p $me)"
          ps -eo pid,pgid,sid,args | awk '$1 < '"$me"' && $2 == '"$(ps -o pgid= -p $me)"
          touch kills.txt
          tail -f kills.txt | awk -v me=$me '{ if (match($0, /kill\((-?[0-9]+), (SIG[A-Z0-9]+)/, m)) { t = m[1] < 0 ? -m[1] : m[1]; if (t < me && m[2] != "0") { print "OLDKILL " $0; fflush() } } }' &
          timeout 600 strace -f -qq -e trace=kill,tgkill,tkill -e signal=none -o kills.txt \
            cargo test --no-fail-fast > out.txt 2>&1
          echo "rc=$?"
          grep -E "^test result|FAILED|running for over" out.txt | head -40
          echo "== distinct kill targets:"; grep -oE "kill\(-?[0-9]+, SIG[A-Z0-9]+" kills.txt | sort | uniq -c | sort -rn | head -40
          exit 0
