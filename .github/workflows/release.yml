name: release
on:
  push:
    tags: ["v*"]
  # Build every target when the release path changes, so a tag never finds
  # a broken platform; publishing happens on tags only.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Dockerfile.release
      - install.sh
      - Cargo.lock

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          # Intel Macs: cross-compiled on Apple silicon (the Intel runners
          # are retired).
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p prova-cli --target ${{ matrix.target }}
      # The shipped binary, end to end, on its own platform (Intel macOS
      # through Rosetta on the Apple silicon runner).
      - name: Smoke test
        run: |
          bin=target/${{ matrix.target }}/release/prova
          if [ "${{ matrix.target }}" = x86_64-apple-darwin ]; then
            arch -x86_64 /bin/sh scripts/smoke.sh "$bin"
          else
            scripts/smoke.sh "$bin"
          fi
      - name: Static binary
        if: contains(matrix.target, 'linux')
        run: |
          file target/${{ matrix.target }}/release/prova
          file target/${{ matrix.target }}/release/prova | grep -Eq "static(ally|-pie) linked"
      - name: Package
        run: |
          name=prova-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/prova README.md LICENSE "$name"/
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Install script on this platform
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          PROVA_BASE_URL="file://$PWD" PROVA_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/prova" --version
      - uses: actions/upload-artifact@v4
        with:
          name: prova-${{ matrix.target }}
          path: prova-${{ matrix.target }}.tar.gz*

  publish:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the version prova reports
        run: |
          v=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but prova-cli is $v"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cp install.sh dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  image:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: prova-*-linux-musl
          merge-multiple: true
      - name: Binaries per Docker platform
        run: |
          mkdir -p image/amd64 image/arm64
          tar xzf dist/prova-x86_64-unknown-linux-musl.tar.gz --strip-components=1 -C image/amd64
          tar xzf dist/prova-aarch64-unknown-linux-musl.tar.gz --strip-components=1 -C image/arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: image
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
