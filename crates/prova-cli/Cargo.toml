[package]
name = "prova-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "prova"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
ctrlc = "3.5.3"
serde_json = "1.0.154"
prova-adapters = { version = "0.1.0", path = "../prova-adapters" }
prova-core = { version = "0.1.0", path = "../prova-core" }
clap_complete = { version = "4.6.12", features = ["unstable-dynamic"] }

[lints]
workspace = true
