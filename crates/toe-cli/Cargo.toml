[package]
name = "toe-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "toe"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
ctrlc = "3.5.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = { version = "0.12.0", features = ["ssl-rustls"] }
toe-adapters = { version = "0.1.0", path = "../toe-adapters" }
toe-core = { version = "0.1.0", path = "../toe-core" }
ureq = { version = "3.5.2", default-features = false, features = ["json", "rustls"] }

[lints]
workspace = true
