# prova's own suites. From M1 on, tests run through prova (AGENTS.md, Stage B):
#   .prova/stable/bin/prova run small
# small and medium run under cargo-nextest with its libtest JSON stream, so
# prova sees prova's own tests at full fidelity (native level, per-test
# durations). The format version is pinned; the stream is experimental.
[suite.small]
run = "NEXTEST_EXPERIMENTAL_LIBTEST_JSON=1 cargo nextest run --lib --bins --no-fail-fast --message-format libtest-json --message-format-version 0.1 --success-output final"
select = "NEXTEST_EXPERIMENTAL_LIBTEST_JSON=1 cargo nextest run --lib --bins --no-fail-fast --message-format libtest-json --message-format-version 0.1 --success-output final {filter}"
size = "small"

[suite.medium]
run = "NEXTEST_EXPERIMENTAL_LIBTEST_JSON=1 cargo nextest run --tests --no-fail-fast --message-format libtest-json --message-format-version 0.1 --success-output final"
select = "NEXTEST_EXPERIMENTAL_LIBTEST_JSON=1 cargo nextest run --tests --no-fail-fast --message-format libtest-json --message-format-version 0.1 --success-output final {filter}"
size = "medium"
stall_after = "2m"

[suite.spec]
run = "scripts/ci.sh"
size = "large"
stall_after = "5m"

# Real fixture projects in every claimed language: go and cargo on the host,
# Python, TypeScript, Java and C# in official images (needs docker). Opt-in.
[suite.large]
run = "cargo test -p prova-cli --test fixtures_large -- --ignored"
size = "large"
stall_after = "3m"
