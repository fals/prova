# prova's own suites. From M1 on, tests run through prova (AGENTS.md, Stage B):
#   .prova/stable/bin/prova run small
# small and medium run under cargo-nextest with its libtest JSON stream, so
# prova sees prova's own tests at full fidelity (native level, per-test
# durations). The format version is pinned; the stream is experimental.
# Each suite's tests get one temporary directory, emptied before the run:
# tests leave their workspaces behind, and tens of thousands of them once
# filled /tmp's inodes (round 16). It is outside the repository on purpose:
# tests rely on not being inside a git work tree. It is named after the
# checkout, so suites of several worktrees can run at once.
[suite.small]
run = "d=/tmp/prova-suite-small-$(basename \"$PWD\") && rm -rf \"$d\" && mkdir -p \"$d\" && TMPDIR=\"$d\" NEXTEST_EXPERIMENTAL_LIBTEST_JSON=1 cargo nextest run --lib --bins --no-fail-fast --message-format libtest-json --message-format-version 0.1 --success-output final"
select = "d=/tmp/prova-suite-small-$(basename \"$PWD\") && rm -rf \"$d\" && mkdir -p \"$d\" && TMPDIR=\"$d\" NEXTEST_EXPERIMENTAL_LIBTEST_JSON=1 cargo nextest run --lib --bins --no-fail-fast --message-format libtest-json --message-format-version 0.1 --success-output final {filter}"
size = "small"

[suite.medium]
run = "d=/tmp/prova-suite-medium-$(basename \"$PWD\") && rm -rf \"$d\" && mkdir -p \"$d\" && TMPDIR=\"$d\" NEXTEST_EXPERIMENTAL_LIBTEST_JSON=1 cargo nextest run --tests --no-fail-fast --message-format libtest-json --message-format-version 0.1 --success-output final"
select = "d=/tmp/prova-suite-medium-$(basename \"$PWD\") && rm -rf \"$d\" && mkdir -p \"$d\" && TMPDIR=\"$d\" NEXTEST_EXPERIMENTAL_LIBTEST_JSON=1 cargo nextest run --tests --no-fail-fast --message-format libtest-json --message-format-version 0.1 --success-output final {filter}"
size = "medium"
stall_after = "2m"

[suite.spec]
run = "scripts/ci.sh"
size = "large"
stall_after = "5m"

# Real fixture projects in every claimed language: go and cargo on the host,
# Python, TypeScript, Java and C# in official images (needs docker). Opt-in.
[suite.large]
# Its own emptied temporary directory too: the fixtures copied there (Go and
# cargo builds) once filled /tmp and failed a build with "no space left on
# device" (run 221b3f88).
run = "d=/tmp/prova-suite-large-$(basename \"$PWD\") && rm -rf \"$d\" && mkdir -p \"$d\" && TMPDIR=\"$d\" cargo test -p prova-cli --test fixtures_large -- --ignored"
size = "large"
stall_after = "3m"
